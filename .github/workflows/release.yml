name: Build & release APK

# Every push/PR builds and tests. Pushing a tag like v1.16.0 also builds the signed APK and
# publishes a GitHub release with the APK and its SHA-256, which the in-app updater checks
# (JellyGlance/Companion-App, see UPDATE_REPO in app/build.gradle.kts).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Restore signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing; release APKs must be signed with the release key so in-app updates install"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/jellyglance-release.jks
          printf 'storeFile=keystore/jellyglance-release.jks\nstorePassword=%s\nkeyAlias=jellyglance\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Name the APK and checksum
        run: |
          name="JellyGlance-Companion-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: JellyGlance-Companion-*

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The "## vX.Y.Z" section for this tag; the app shows it in its update sheet.
          awk -v tag="## $GITHUB_REF_NAME" '$0==tag{on=1;next} /^## /{on=0} on' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: JellyGlance Companion ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            JellyGlance-Companion-*.apk
            JellyGlance-Companion-*.apk.sha256

      # Optional: announce the release to a webhook (Discord, or anything that accepts JSON).
      # Set the repo secret RELEASE_WEBHOOK_URL to turn it on; without it this step is skipped.
      - name: Notify release webhook
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "RELEASE_WEBHOOK_URL not set, skipping"; exit 0; fi
          apk="JellyGlance-Companion-$GITHUB_REF_NAME.apk"
          apk_url="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$apk"
          sha=$(cut -d' ' -f1 "$apk.sha256")
          notes=$(head -c 1500 release-notes.md)
          # Discord reads content/embeds; other services get the same fields as plain JSON.
          jq -n --arg v "$GITHUB_REF_NAME" --arg url "$RELEASE_URL" --arg apk "$apk_url" --arg sha "$sha" --arg notes "$notes" '{
            username: "JellyGlance",
            content: "JellyGlance Companion \($v) is out",
            embeds: [{
              title: "JellyGlance Companion \($v)", url: $url, color: 10185416, description: $notes,
              fields: [{ name: "Download", value: "[APK](\($apk))", inline: true }, { name: "SHA-256", value: ("`" + $sha + "`") }]
            }],
            version: $v, release_url: $url, apk_url: $apk, sha256: $sha, notes: $notes
          }' > webhook.json
          curl -fsS -X POST -H "Content-Type: application/json" --data @webhook.json "$WEBHOOK_URL"
          echo "Webhook notified"
